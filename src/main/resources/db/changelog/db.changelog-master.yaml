databaseChangeLog:
  - changeSet:
      id: 1-create-limits-table
      author: suroegina
      changes:
        - sql:
            sql: >
              CREATE TABLE limits (
                user_id BIGINT PRIMARY KEY,
                limit_value NUMERIC(19,2) NOT NULL
              );

  - changeSet:
      id: 2-create-limit-reservations-table
      author: suroegina
      changes:
        - sql:
            sql: >
              CREATE TABLE limit_reservations (
                id UUID PRIMARY KEY,
                user_id BIGINT NOT NULL,
                amount NUMERIC(19,2) NOT NULL,
                status VARCHAR(20) NOT NULL,
                created_at TIMESTAMP NOT NULL,
                updated_at TIMESTAMP NOT NULL
              );
