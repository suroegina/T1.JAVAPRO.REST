server:
  port: 8080

spring:
  application:
    name: limits-service
  datasource:
    url: jdbc:postgresql://localhost:5438/suroegina
    username: suroegina
    password: 200588
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Схему полностью ведёт Liquibase — Hibernate ничего не создаёт и не проверяет.
      ddl-auto: none
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    # Адрес Kafka из docker-compose (контейнер слушает на 9092).
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: limits-notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  mail:
    # Yandex SMTP. Пароль берётся из переменной окружения MAIL_PASSWORD
    host: smtp.yandex.ru
    port: 465
    username: daria-20@yandex.ru
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true

app:
  limit:
    # Дефолтный лимит, общий для всех пользователей.
    default-value: 100000.00
    # Сколько времени резервирование может «висеть» до автоотмены (стратегия восстановления).
    reservation-ttl: 10m
    # Как часто запускается задача восстановления «зависших» резервирований (в миллисекундах).
    recovery-interval: 60000
  kafka:
    # Топик, куда продюсер пишет события о резерве/списании лимита.
    topic: limit-events
  notification:
    # Отправитель и получатель уведомлений о смене статуса лимита.
    from: daria-20@yandex.ru
    recipient: daria-20@yandex.ru
