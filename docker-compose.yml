services:
  # Apache Kafka (официальный образ) в режиме KRaft — один узел, без ZooKeeper.
  kafka:
    image: apache/kafka:3.7.0
    container_name: limits-kafka
    restart: unless-stopped
    ports:
      # Внешний порт для подключения из хоста (наше Spring-приложение).
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data

  # Kafka UI — веб-интерфейс для визуализации топиков и сообщений.
  # extra_hosts маппит «localhost» на host-gateway, чтобы UI (в bridge-сети)
  # мог достучаться до Kafka, которая анонсирует себя как localhost:9092.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: limits-kafka-ui
    restart: unless-stopped
    ports:
      - "8081:8080"
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: localhost:9092

  # Mailpit — локальный SMTP-сброс и веб-просмотр писем (для отладки email).
  mailpit:
    image: axllent/mailpit:latest
    container_name: limits-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP — сюда шлёт письма NotificationService
      - "8025:8025"   # Web UI — http://localhost:8025

volumes:
  kafka_data:
