services:
  # Apache Kafka в режиме KRaft (один узел, без ZooKeeper).
  kafka:
    image: bitnami/kafka:3.7
    container_name: limits-kafka
    restart: unless-stopped
    ports:
      # Внешний порт для подключения из хоста (наше приложение и Kafka UI).
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka_data:/bitnami/kafka

  # Kafka UI — веб-интерфейс для визуализации топиков и сообщений.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: limits-kafka-ui
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka

  # Mailpit — локальный SMTP-сброс и веб-просмотр писем (для отладки email).
  mailpit:
    image: axllent/mailpit:latest
    container_name: limits-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP — сюда шлёт письма NotificationService
      - "8025:8025"   # Web UI — http://localhost:8025

volumes:
  kafka_data:
